<div class="login-container">
  <div class="login-card">

    <div class="form-section">
      <div class="header">
        <div class="brand-pill">
        </div>
        <h1>Control de Inventario</h1>
        <p>Ingresa tus credenciales para acceder</p>
      </div>

      @if (errorMessage) {
      <div class="error-alert" role="alert">
        <span class="material-symbols-outlined error-icon">error</span>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Correo</label>
          <div class="input-wrapper">
            <span class="icon" aria-hidden="true">
              <span class="material-symbols-outlined">alternate_email</span>
            </span>
            <input id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="email"
              placeholder="usuario@gmail.com" [disabled]="loading" maxlength="30" />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
          </div>
          <div class="input-wrapper">
            <span class="icon" aria-hidden="true">
              <span class="material-symbols-outlined">lock</span>
            </span>
            <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
              required autocomplete="current-password" placeholder="••••••••••••" [disabled]="loading" maxlength="10" />
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
              <span class="material-symbols-outlined">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading || !email || !password">
          @if (loading) {
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Verificando credenciales...</span>
          } @else {
          <span>Acceder</span>
          <span class="material-symbols-outlined btn-arrow">arrow_forward</span>
          }
        </button>
      </form>

      <div class="footer-security-note">
        <span class="security-dot"></span>
        <span>Autenticación protegida con JWT Bearer & Rate Limiting</span>
      </div>
    </div>


  </div>
</div>
