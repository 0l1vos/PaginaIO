<div class="login-container">
  <div class="login-card" #loginCardRef>
    <div class="editorial-loader-bar" #loaderBarRef [class.active]="loading"></div>

    <div class="form-section">
      <div class="header">
        <div class="brand-pill">
          <span class="ember-dot"></span>
          <span class="brand-kicker">Inventario de Activos</span>
        </div>
        <h1>Control de Inventario</h1>
        <p>Ingresa tus credenciales para acceder al sistema</p>
      </div>

      @if (errorMessage) {
      <div class="error-alert" role="alert" #errorAlertRef>
        <span class="material-symbols-outlined error-icon">error</span>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Correo</label>
          <div class="input-wrapper">
            <span class="icon" aria-hidden="true">
              <span class="material-symbols-outlined">alternate_email</span>
            </span>
            <input id="email" type="email" name="email" [(ngModel)]="email" required autocomplete="username"
              autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="usuario@gmail.com"
              [disabled]="loading" maxlength="40" />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
          </div>
          <div class="input-wrapper">
            <span class="icon" aria-hidden="true">
              <span class="material-symbols-outlined">lock</span>
            </span>
            <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
              required autocomplete="current-password" placeholder="••••••••••••" [disabled]="loading" maxlength="40" />
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
              <span class="material-symbols-outlined">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading" [class.is-loading]="loading"
          [class.is-success]="isSuccess">
          @if (isSuccess) {
          <span class="material-symbols-outlined btn-icon-check">verified</span>
          <span class="font-mono">ACCESO CONCEDIDO</span>
          } @else if (loading) {
          <span class="loading-state-box">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="font-mono loading-ticker">VERIFICANDO CREDENCIALES...</span>
          </span>
          } @else {
          <span>Acceder</span>
          <span class="material-symbols-outlined btn-arrow">arrow_forward</span>
          }
        </button>
      </form>

      <div class="footer-security-note">
        <span class="security-dot"></span>
        <span>Autenticación protegida con JWT Bearer & Rate Limiting</span>
      </div>
    </div>



  </div>
</div>
